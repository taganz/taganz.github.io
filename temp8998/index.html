  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

index:1;color:var(--y)}\n.hero-sub{font-size:15px;opacity:.82;max-width:460px;line-height:1.6;position:relative;z-index:1}\n.section{padding:32px 40px}\n.section+.section{border-top:1px solid #EAE4FA}\n.section-alt{background:var(--g)}\n.s-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p4);margin-bottom:12px}\n.s-title{font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--p);margin-bottom:8px;line-height:1.3}\n.s-desc{font-size:14px;color:var(--txm);line-height:1.65;margin-bottom:20px}\n.divider-y{height:3px;background:var(--y);width:40px;margin:12px 0 18px}\n.pillar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n.pillar{background:var(--p5);border-radius:12px;padding:16px 14px}\n.pillar-icon{width:32px;height:32px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:10px;color:var(--p)}\n.pillar-icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.pillar-name{font-size:13px;font-weight:600;color:var(--p);margin-bottom:4px}\n.pillar-desc{font-size:12px;color:var(--txm);line-height:1.55}\n.product-block{margin-bottom:22px}\n.product-block:last-child{margin-bottom:0}\n.prod-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}\n.prod-dot{width:10px;height:10px;border-radius:50%;background:var(--y);flex-shrink:0}\n.prod-name{font-size:16px;font-weight:600;color:var(--p)}\n.prod-desc{font-size:13px;color:var(--txm);line-height:1.6;padding-left:20px;margin-bottom:8px}\n.feat-list{list-style:none;padding-left:20px;display:flex;flex-direction:column;gap:4px}\n.feat-list li{font-size:12px;color:var(--txm);display:flex;align-items:flex-start;gap:6px}\n.feat-list li::before{content:'✓';color:var(--p3);font-weight:700;flex-shrink:0;margin-top:1px}\n.otras-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p4);margin:28px 0 14px}\n.otras-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.otra-card{border-radius:10px;padding:16px 18px}\n.otra-card.digital{background:var(--p);color:#fff}\n.otra-card.custom{background:var(--y);color:var(--p)}\n.otra-name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin-bottom:6px}\n.otra-desc{font-size:12px;line-height:1.6;opacity:.82}\n.coach-block{background:var(--p);border-radius:14px;padding:24px;color:#fff}\n.coach-title{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:6px}\n.coach-title span{color:var(--y)}\n.coach-sub{font-size:13px;opacity:.75;margin-bottom:16px;line-height:1.55}\n.coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.coach-item{background:rgba(255,255,255,.08);border-radius:8px;padding:12px}\n.coach-item-title{font-size:12px;font-weight:600;color:var(--y);margin-bottom:4px}\n.coach-item-desc{font-size:11px;opacity:.72;line-height:1.5}\n.user-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.user-card{border:1px solid #DDD5F8;border-radius:10px;padding:14px}\n.user-type{font-size:11px;font-weight:600;color:var(--p3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}\n.user-problem{font-size:12px;color:var(--tx);font-weight:500;margin-bottom:6px;line-height:1.4}\n.user-offer{font-size:11px;color:var(--txm);line-height:1.5}\n.academy-row{display:flex;gap:12px;flex-wrap:wrap}\n.acad-pill{background:var(--p5);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--p);font-weight:500;flex:1;min-width:140px}\n.acad-pill-title{font-size:11px;font-weight:600;color:var(--p3);margin-bottom:2px}\n.footer{background:var(--p);color:#fff;padding:28px 40px;display:flex;justify-content:space-between;align-items:center}\n.footer-logo{font-family:'Fraunces',serif;font-size:22px;font-weight:600}\n.footer-logo span{color:var(--y)}\n.footer-url{font-size:13px;opacity:.6}\n.footer-legal{font-size:10px;opacity:.45;margin-top:4px}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"hero\">\n  <div class=\"hero-tag\">Secundaria<\u002Fdiv>\n  <h1>La editorial que enseña a cada uno como necesita<\u002Fh1>\n  <p class=\"hero-sub\">Materiales curriculares híbridos con IA, diseñados para la diversidad del aula y la competencia comunicativa.<\u002Fp>\n<\u002Fdiv>\n\n<div class=\"section\">\n  <div class=\"s-label\">Por qué Sarela<\u002Fdiv>\n  <h2 class=\"s-title\">El aula ha cambiado. Los materiales también deben hacerlo.<\u002Fh2>\n  <p class=\"s-desc\">Mayor diversidad, alumnado con necesidades más complejas, impacto de las redes en la competencia lectora… y docentes sin tiempo. Las editoriales tradicionales no responden a este entorno. Sarela sí.<\u002Fp>\n  <div class=\"pillar-grid\">\n    <div class=\"pillar\">\n      <div class=\"pillar-icon\"><svg viewBox=\"0 0 24 24\"><circle cx=\"8\" cy=\"8\" r=\"2.5\"><\u002Fcircle><circle cx=\"16\" cy=\"8\" r=\"2.5\"><\u002Fcircle><path d=\"M3.5 18c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5\"><\u002Fpath><path d=\"M11.5 18c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"pillar-name\">Atención a la diversidad<\u002Fdiv>\n      <div class=\"pillar-desc\">Materiales con enfoque de Diseño Universal para el Aprendizaje, adaptables sin sobrecargar al docente.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pillar\">\n      <div class=\"pillar-icon\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 5h11a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H9l-4 3v-3H4z\"><\u002Fpath><path d=\"M8 10h7\"><\u002Fpath><path d=\"M8 13h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"pillar-name\">Competencia CCL<\u002Fdiv>\n      <div class=\"pillar-desc\">La comunicación lingüística trabajada de forma transversal en todas las materias, no solo en Lengua.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pillar\">\n      <div class=\"pillar-icon\"><svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"3\"><\u002Frect><path d=\"M9 9h6v6H9z\"><\u002Fpath><path d=\"M9 3v2M15 3v2M9 19v2M15 19v2M3 9h2M3 15h2M19 9h2M19 15h2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div class=\"pillar-name\">IA al servicio del aula<\u002Fdiv>\n      <div class=\"pillar-desc\">Un Coach IA entrenado en currículo, NEAE y CCL que acompaña al docente sin añadir burocracia.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"section section-alt\">\n  <div class=\"s-label\">Solución principal<\u002Fdiv>\n  <h2 class=\"s-title\">Sarela Híbrida<\u002Fh2>\n  <div class=\"divider-y\"><\u002Fdiv>\n\n  <div class=\"product-block\">\n    <div class=\"prod-header\"><div class=\"prod-dot\"><\u002Fdiv><div class=\"prod-name\">Sarela Hub<\u002Fdiv><\u002Fdiv>\n    <p class=\"prod-desc\">Currículo completo para ESO (42 materias) con contenidos inclusivos, CCL transversal y Coach IA integrado. Incluye Sarela Plataforma con integración en los principales LMS autonómicos.<\u002Fp>\n    <ul class=\"feat-list\">\n      <li>Materiales curriculares DUA: programaciones, unidades y libro del alumno<\u002Fli>\n      <li>Proyecto interdisciplinar CCL con sello La Voz de Galicia<\u002Fli>\n      <li>Plataforma compatible con Moodle Centros, Edixgal y Google Classroom (WCAG 2.1 AA)<\u002Fli>\n      <li>Coach IA: preparación de clases, adaptaciones NEAE, evaluación y progreso<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"product-block\">\n    <div class=\"prod-header\"><div class=\"prod-dot\"><\u002Fdiv><div class=\"prod-name\">Servicios de impresión<\u002Fdiv><\u002Fdiv>\n    <p class=\"prod-desc\">Los recursos de Sarela pueden ser personalizados e impresos a través del acuerdo con nuestros partners o directamente por el centro.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"product-block\">\n    <div class=\"prod-header\"><div class=\"prod-dot\"><\u002Fdiv><div class=\"prod-name\">Entorno familiar<\u002Fdiv><\u002Fdiv>\n    <p class=\"prod-desc\">Herramientas para involucrar a las familias en el proceso de aprendizaje, con visibilidad clara sobre el progreso y los materiales de su hijo.<\u002Fp>\n    <ul class=\"feat-list\">\n      <li>Informes de progreso periódicos (objetivos, actividades, adaptaciones)<\u002Fli>\n      <li>Acceso a materiales del alumno y posibilidad de impresión<\u002Fli>\n      <li>Experiencias de aprendizaje en familia y formación para el hogar<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div class=\"otras-label\">Otras soluciones Sarela<\u002Fdiv>\n  <div class=\"otras-grid\">\n    <div class=\"otra-card digital\">\n      <div class=\"otra-name\">Sarela Digital<\u002Fdiv>\n      <p class=\"otra-desc\">Sarela Hub integrada en las plataformas de las CCAA para proyectos institucionales.&nbsp;<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"otra-card custom\">\n      <div class=\"otra-name\">Sarela Custom<\u002Fdiv>\n      <p class=\"otra-desc\">Servicio de adaptación de contenidos a la metodología específica del centro u otras etapas educativas.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"section\">\n  <div class=\"s-label\">Inteligencia Artificial<\u002Fdiv>\n  <div class=\"coach-block\">\n    <div class=\"coach-title\">Sarela <span>Coach IA<\u002Fspan><\u002Fdiv>\n    <p class=\"coach-sub\">Una IA entrenada en el currículo, NEAE y CCL. Accede a los contenidos de Sarela Hub, el catálogo de Sarela Academy y el equipo de acompañamiento. No te da más trabajo — te lo quita.<\u002Fp>\n    <div class=\"coach-grid\">\n      <div class=\"coach-item\"><div class=\"coach-item-title\">Preparación de clases<\u002Fdiv><div class=\"coach-item-desc\">Crea actividades, resúmenes y recursos. Personaliza la secuencia para diferentes grupos.<\u002Fdiv><\u002Fdiv>\n      <div class=\"coach-item\"><div class=\"coach-item-title\">Gestión de la diversidad<\u002Fdiv><div class=\"coach-item-desc\">Itinerarios personalizados, adaptaciones con IA, lectura fácil y accesibilidad para NEAE.<\u002Fdiv><\u002Fdiv>\n      <div class=\"coach-item\"><div class=\"coach-item-title\">Apoyo CCL<\u002Fdiv><div class=\"coach-item-desc\">Evaluación de escritura y oralidad, atención a la diversidad lingüística, transferencia interdisciplinar.<\u002Fdiv><\u002Fdiv>\n      <div class=\"coach-item\"><div class=\"coach-item-title\">Evaluación y progreso<\u002Fdiv><div class=\"coach-item-desc\">Soporte corrección, detección de alumnado en riesgo, informes de progreso para familias.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"section section-alt\">\n  <div class=\"s-label\">Usuarios y propuesta<\u002Fdiv>\n  <h2 class=\"s-title\">¿Qué resolvemos a cada usuario?<\u002Fh2>\n  <div class=\"divider-y\"><\u002Fdiv>\n  <div class=\"user-grid\">\n    <div class=\"user-card\"><div class=\"user-type\">Docentes<\u002Fdiv><div class=\"user-problem\">\"Me cuesta mucho tiempo hacer adaptaciones y me falta formación para hacerlas bien.\"<\u002Fdiv><div class=\"user-offer\">Situaciones de aprendizaje con herramientas de adaptación integradas en la materia. Microlearning continuo.<\u002Fdiv><\u002Fdiv>\n    <div class=\"user-card\"><div class=\"user-type\">Dirección · Concertados / Privados<\u002Fdiv><div class=\"user-problem\">\"Necesito coordinar la diversidad y la CCL sin sobrecargar a mis departamentos.\"<\u002Fdiv><div class=\"user-offer\">Perspectiva transversal con materiales para coordinar CCL. Capitalización de adaptaciones del centro.<\u002Fdiv><\u002Fdiv>\n    <div class=\"user-card\"><div class=\"user-type\">AAPP · Licitaciones<\u002Fdiv><div class=\"user-problem\">\"Necesito mejorar competencias en entornos de alta diversidad con profesorado sobrecargado.\"<\u002Fdiv><div class=\"user-offer\">Materiales ajustados a licitación. Compatible con plataformas autonómicas. Producción custom.<\u002Fdiv><\u002Fdiv>\n    <div class=\"user-card\"><div class=\"user-type\">Familias<\u002Fdiv><div class=\"user-problem\">\"Quiero saber cómo progresa mi hijo y poder apoyarle en casa.\"<\u002Fdiv><div class=\"user-offer\">Informes de progreso sencillos. Acceso a materiales. Experiencias de implicación familiar.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"section\">\n  <div class=\"s-label\">Formación y acompañamiento<\u002Fdiv>\n  <h2 class=\"s-title\">Sarela Academy<\u002Fh2>\n  <p class=\"s-desc\">Formación específica y continua para el equipo docente, integrada en el flujo de trabajo.<\u002Fp>\n  <div class=\"academy-row\">\n    <div class=\"acad-pill\"><div class=\"acad-pill-title\">Formación inicial<\u002Fdiv>Onboarding adaptado al centro<\u002Fdiv>\n    <div class=\"acad-pill\"><div class=\"acad-pill-title\">Microlearning continuo<\u002Fdiv>Recomendaciones del Coach IA<\u002Fdiv>\n    <div class=\"acad-pill\"><div class=\"acad-pill-title\">CCL · DUA · ABP<\u002Fdiv>Temáticas para ANL y departamentos<\u002Fdiv>\n    <div class=\"acad-pill\"><div class=\"acad-pill-title\">Persona de contacto<\u002Fdiv>Acompañamiento humano garantizado<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"footer\">\n  <div>\n    <div class=\"footer-logo\">Sarela <span>Editorial<\u002Fspan><\u002Fdiv>\n    <div class=\"footer-url\">sarelaeditorial.com<\u002Fdiv>\n    <div class=\"footer-legal\">© 2026 Smarted Soluciones Educativas, S.L.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:right;font-size:12px;opacity:.6\">Netex · La Voz de Galicia<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
